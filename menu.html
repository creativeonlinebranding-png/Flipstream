<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FlipStream Menu</title>

<style>

/* HAMBURGER BUTTON */
#menuButton {
    position: fixed !important;
    top: 18px !important;
    right: 18px !important;

    width: 46px !important;
    height: 46px !important;

    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 6px !important;

    background: transparent !important;
    border: none !important;

    cursor: pointer !important;
    z-index: 10005 !important;
}

#menuButton span {
    display: block !important;
    width: 23px !important;
    height: 2px !important;

    background: #D4AF37 !important;
    border-radius: 5px !important;

    transition: .3s !important;
}

#menuButton.active span:nth-child(1) {
    transform: translateY(8px) rotate(45deg);
}

#menuButton.active span:nth-child(2) {
    opacity: 0;
}

#menuButton.active span:nth-child(3) {
    transform: translateY(-8px) rotate(-45deg);
}


/* DARK BACKGROUND OVERLAY */
#menuOverlay {
    position: fixed !important;
    inset: 0 !important;

    background: rgba(0,0,0,.55) !important;

    opacity: 0 !important;
    visibility: hidden !important;

    transition: .25s !important;

    z-index: 10002 !important;
}

#menuOverlay.active {
    opacity: 1 !important;
    visibility: visible !important;
}


/* COMPACT MENU PANEL */
#menuDrawer {
    position: fixed !important;

    top: 75px !important;
    right: 18px !important;

    width: 250px !important;
    max-width: calc(100vw - 36px) !important;

    height: auto !important;
    max-height: 75vh !important;

    overflow-y: auto !important;

    background: #090909 !important;

    border: 1px solid rgba(212,175,55,.25) !important;
    border-radius: 15px !important;

    padding: 12px !important;

    box-shadow: 0 15px 40px rgba(0,0,0,.75) !important;

    transform: translateY(-10px) !important;
    opacity: 0 !important;
    visibility: hidden !important;

    transition: .25s ease !important;

    z-index: 10003 !important;
}

#menuDrawer.active {
    transform: translateY(0) !important;
    opacity: 1 !important;
    visibility: visible !important;
}


/* MENU LINKS */
#menuDrawer .menuLink {
    display: block !important;

    width: 100% !important;

    padding: 15px 14px !important;
    margin: 0 0 5px 0 !important;

    background: transparent !important;
    border: none !important;

    color: inherit !important;

    font-family: inherit !important;
    font-size: 14px !important;
    font-weight: 600 !important;

    text-decoration: none !important;

    text-align: left !important;

    white-space: normal !important;

    border-radius: 8px !important;

    cursor: pointer !important;
}

#menuDrawer .menuLink:last-child {
    margin-bottom: 0 !important;
}

#menuDrawer .menuLink:hover {
    background: rgba(255,255,255,.08) !important;
}

</style>
</head>

<body>

<!-- HAMBURGER -->
<button
    id="menuButton"
    aria-label="Open menu"
    aria-expanded="false">

    <span></span>
    <span></span>
    <span></span>

</button>


<!-- OVERLAY -->
<div id="menuOverlay"></div>


<!-- MENU PANEL -->
<nav id="menuDrawer">

    <a class="menuLink" href="index.html">
        Home
    </a>

    <a class="menuLink" href="artists.html">
        Artist Profiles
    </a>

    <a class="menuLink" href="privacy-policy.html">
        Privacy Policy
    </a>

</nav>

</body>
</html>
