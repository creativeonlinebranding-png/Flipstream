<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: transparent;
    font-family: Arial, sans-serif;
}

/* Hamburger button */
#menuButton {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 10001;

    width: 46px;
    height: 46px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;

    background: #000;
    border: 1px solid #D4AF37;
    border-radius: 12px;

    cursor: pointer;
}

#menuButton span {
    width: 21px;
    height: 2px;
    background: #D4AF37;
    border-radius: 5px;
    transition: .3s;
}

#menuButton.active span:nth-child(1) {
    transform: translateY(8px) rotate(45deg);
}

#menuButton.active span:nth-child(2) {
    opacity: 0;
}

#menuButton.active span:nth-child(3) {
    transform: translateY(-8px) rotate(-45deg);
}

/* Overlay */
#menuOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    opacity: 0;
    visibility: hidden;
    transition: .3s;
    z-index: 10002;
}

#menuOverlay.active {
    opacity: 1;
    visibility: visible;
}

/* Drawer */
#menuDrawer {
    position: fixed;
    top: 0;
    right: 0;

    width: min(290px, 82vw);
    height: 100vh;

    background: #080808;
    border-left: 1px solid #8C6A1F;

    padding: 85px 22px 25px;

    transform: translateX(100%);
    transition: transform .3s ease;

    z-index: 10003;
}

#menuDrawer.active {
    transform: translateX(0);
}

/* Menu links */
.menuLink {
    display: block;
    padding: 19px 15px;
    margin-bottom: 13px;

    background: #141414;
    border: 1px solid rgba(212,175,55,.25);
    border-radius: 10px;

    color: #F9E79F;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;

    transition: .2s;
}

.menuLink:hover {
    border-color: #D4AF37;
    background: #211B0C;
}

</style>
</head>

<body>

<button id="menuButton" aria-label="Open menu" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
</button>

<div id="menuOverlay"></div>

<nav id="menuDrawer">

    <a class="menuLink" href="artists.html">
        Artist Profiles
    </a>

    <a class="menuLink" href="privacy-policy.html">
        Privacy Policy
    </a>

</nav>

<script>
const menuButton = document.getElementById("menuButton");
const menuDrawer = document.getElementById("menuDrawer");
const menuOverlay = document.getElementById("menuOverlay");

function openMenu() {
    menuButton.classList.add("active");
    menuDrawer.classList.add("active");
    menuOverlay.classList.add("active");
    menuButton.setAttribute("aria-expanded", "true");
}

function closeMenu() {
    menuButton.classList.remove("active");
    menuDrawer.classList.remove("active");
    menuOverlay.classList.remove("active");
    menuButton.setAttribute("aria-expanded", "false");
}

menuButton.addEventListener("click", () => {
    menuDrawer.classList.contains("active")
        ? closeMenu()
        : openMenu();
});

menuOverlay.addEventListener("click", closeMenu);

document.addEventListener("keydown", event => {
    if (event.key === "Escape") closeMenu();
});
</script>

</body>
</html>
